readmates:
  auth:
    return-state-secret: "test-return-state-secret-for-local-tests"
  bff-secret-required: false
  admin:
    command-identity:
      current-key: test-admin-command-digest-current-key
      current-key-version: 1
      previous-key: test-admin-command-digest-previous-key
      previous-key-version: 0
      write-previous-alias: false
      allow-empty-secret: false
    command-idempotency:
      retention: 168h
      initial-claim-ttl: 15m
      purge-batch-size: 100
      purge-interval: 1h
      previous-key-rollout-buffer: 24h
      preview-ttl: 10m
      domain-convergence-max-attempts: 3
  security:
    ip-hash:
      base-secret: test-ip-hash-base-secret
      allow-empty-secret: false
    host-list-cursor:
      current-key: test-host-list-cursor-current-key
      current-key-version: 1
      previous-key: test-host-list-cursor-previous-key
      previous-key-version: 0
      allow-empty-secret: false
  mutation:
    idempotency:
      current-key: test-mutation-identity-current-key
      current-key-version: 1
      previous-key: test-mutation-identity-previous-key
      previous-key-version: 0
      allow-empty-secret: false

spring:
  ai:
    model:
      audio:
        speech: none
        transcription: none
      chat: none
      embedding: none
      embedding.multimodal: none
      embedding.text: none
      image: none
      moderation: none

management:
  tracing:
    export:
      enabled: false
  otlp:
    metrics:
      export:
        enabled: false
