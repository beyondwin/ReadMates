name: Host Client Rollout Evidence

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: host-client-rollout-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    name: Bind protected rollout source
    if: ${{ github.ref_protected && github.event_name == 'workflow_dispatch' && github.event.repository.fork == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: host-client-rollout-source
      deployment: false
    outputs:
      stage: ${{ steps.source.outputs.stage }}
      git-sha: ${{ steps.source.outputs.git-sha }}
      candidate-id: ${{ steps.source.outputs.candidate-id }}
      release-tag: ${{ steps.source.outputs.release-tag }}
      started-at: ${{ steps.source.outputs.started-at }}
      a7-sha: ${{ steps.provenance.outputs.a7-sha }}
      c1-sha: ${{ steps.provenance.outputs.c1-sha }}
      b7-sha: ${{ steps.provenance.outputs.b7-sha }}
      d3-sha: ${{ steps.provenance.outputs.d3-sha }}
      d5-sha: ${{ steps.provenance.outputs.d5-sha }}
      cache-source-set-digest: ${{ steps.provenance.outputs.cache-source-set-digest }}
    steps:
      - name: Check out the protected candidate and full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve immutable stage identity
        id: source
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/heads/host-rollout-r2a) stage="r2a" ;;
            refs/heads/host-rollout-r2b) stage="r2b" ;;
            *) echo "Unsupported protected rollout ref." >&2; exit 1 ;;
          esac
          sha="$(git rev-parse --verify 'HEAD^{commit}')"
          mapfile -t tags < <(git tag --points-at "$sha" --list 'v[0-9]*.[0-9]*.[0-9]*')
          test "${#tags[@]}" -eq 1
          tag="${tags[0]}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git cat-file -t "$tag")" = "tag"
          test "$(git rev-list -n 1 "$tag")" = "$sha"
          {
            printf 'stage=%s\n' "$stage"
            printf 'git-sha=%s\n' "$sha"
            printf 'candidate-id=%s-%s\n' "$stage" "${sha:0:12}"
            printf 'release-tag=%s\n' "$tag"
            printf 'started-at=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_OUTPUT"
      - name: Fail closed unless protected environments have fresh external authority
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for environment in host-client-rollout-source host-client-rollout-r2a host-client-rollout-evidence production; do
            response="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/environments/${environment}")"
            jq -e '
              any(.protection_rules[]?;
                .type == "required_reviewers" and
                .prevent_self_review == true and
                ((.reviewers // []) | length) > 0) and
              .deployment_branch_policy.protected_branches == false and
              .deployment_branch_policy.custom_branch_policies == true
            ' <<< "$response" >/dev/null
          done
          source_policies="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/environments/host-client-rollout-source/deployment-branch-policies" -f per_page=100)"
          r2a_policies="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/environments/host-client-rollout-r2a/deployment-branch-policies" -f per_page=100)"
          evidence_policies="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/environments/host-client-rollout-evidence/deployment-branch-policies" -f per_page=100)"
          production_policies="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/environments/production/deployment-branch-policies" -f per_page=100)"
          jq -e '[.branch_policies[].name] | sort == ["host-rollout-r2a", "host-rollout-r2b"]' <<< "$source_policies" >/dev/null
          jq -e '[.branch_policies[].name] == ["host-rollout-r2a"]' <<< "$r2a_policies" >/dev/null
          jq -e '[.branch_policies[].name] | sort == ["host-rollout-r2a", "host-rollout-r2b"]' <<< "$evidence_policies" >/dev/null
          jq -e '[.branch_policies[].name] | sort == ["host-rollout-r2a", "host-rollout-r2b"]' <<< "$production_policies" >/dev/null
      - name: Resolve exact checkpoint provenance and C1 source set
        id: provenance
        shell: bash
        run: |
          set -euo pipefail
          resolve_checkpoint() {
            local output_name="$1"
            local subject="$2"
            local candidate
            local -a matches=()
            while IFS= read -r candidate; do
              if [[ "$(git log -1 --format='%s' "$candidate")" == "$subject" ]]; then matches+=("$candidate"); fi
            done < <(git log --format='%H' --fixed-strings --grep="$subject")
            test "${#matches[@]}" -eq 1
            printf '%s=%s\n' "$output_name" "${matches[0]}" >> "$GITHUB_OUTPUT"
          }
          resolve_checkpoint a7-sha 'fix(server): complete legacy publication revision signals'
          resolve_checkpoint c1-sha 'feat(publication): version public projections and convergence'
          if [[ "$GITHUB_REF" == "refs/heads/host-rollout-r2b" ]]; then
            resolve_checkpoint b7-sha 'feat(front): purge host state on authority loss'
            resolve_checkpoint d3-sha 'test(host): prove client contract v3 compatibility'
            resolve_checkpoint d5-sha 'test(host): verify authority and public cache recovery'
          fi
          c1_sha="$(git log --format='%H' -1 --fixed-strings --grep='feat(publication): version public projections and convergence')"
          test "$(git log -1 --format='%s' "$c1_sha")" = 'feat(publication): version public projections and convergence'
          mapfile -t c1_paths < <(git diff-tree --no-commit-id --name-only -r "$c1_sha" | LC_ALL=C sort -u)
          test "${#c1_paths[@]}" -gt 0
          for path in "${c1_paths[@]}"; do
            [[ "$path" =~ ^(front|server|scripts)/[A-Za-z0-9._/-]+$ ]]
          done
          source_args=()
          for path in "${c1_paths[@]}"; do source_args+=(--path "$path"); done
          python3 -B scripts/host-rollout-evidence-reporter.py source-set \
            --checkpoint "$c1_sha" \
            --candidate "$(git rev-parse --verify 'HEAD^{commit}')" \
            "${source_args[@]}" \
            --github-output "$GITHUB_OUTPUT"
      - name: Enforce stage provenance ancestry
        shell: bash
        env:
          STAGE: ${{ steps.source.outputs.stage }}
          CANDIDATE_SHA: ${{ steps.source.outputs.git-sha }}
          A7_SHA: ${{ steps.provenance.outputs.a7-sha }}
          C1_SHA: ${{ steps.provenance.outputs.c1-sha }}
          B7_SHA: ${{ steps.provenance.outputs.b7-sha }}
          D3_SHA: ${{ steps.provenance.outputs.d3-sha }}
          D5_SHA: ${{ steps.provenance.outputs.d5-sha }}
        run: |
          set -euo pipefail
          if [[ "$STAGE" == "r2a" ]]; then
            provenance=("$A7_SHA" "$C1_SHA")
          else
            provenance=("$B7_SHA" "$C1_SHA" "$D3_SHA" "$D5_SHA")
          fi
          for source_sha in "${provenance[@]}"; do
            [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
            git merge-base --is-ancestor "$source_sha" "$CANDIDATE_SHA"
          done

  pages-candidate:
    name: Package exact deterministic Pages candidate
    needs: source
    if: ${{ needs.source.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      pages-digest: ${{ steps.digest.outputs.pages-digest }}
    steps:
      - name: Check out exact protected SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.source.outputs.git-sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Build exact candidate
        shell: bash
        run: |
          set -euo pipefail
          if command -v corepack >/dev/null 2>&1; then corepack_cmd=(corepack); else corepack_cmd=(npx --yes corepack@0.35.0); fi
          "${corepack_cmd[@]}" enable
          "${corepack_cmd[@]}" prepare "$(node -p "require('./package.json').packageManager")" --activate
          "${corepack_cmd[@]}" pnpm install --frozen-lockfile
          "${corepack_cmd[@]}" pnpm --dir front lint
          "${corepack_cmd[@]}" pnpm --dir front test
          "${corepack_cmd[@]}" pnpm --dir front build
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -C front -cf "$RUNNER_TEMP/readmates-pages-candidate.tar" dist functions
      - name: Hash exact candidate bytes
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          digest="$(sha256sum "$RUNNER_TEMP/readmates-pages-candidate.tar" | cut -d ' ' -f 1)"
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          printf 'pages-digest=sha256:%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Upload exact candidate without repackaging
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ runner.temp }}/readmates-pages-candidate.tar
          archive: false
          if-no-files-found: error
          retention-days: 14

  prime-r2a-cache:
    name: Prime the pre-change browser cache
    needs: source
    if: ${{ needs.source.outputs.stage == 'r2a' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: host-client-rollout-r2a
      deployment: false
    outputs:
      pre-change-cached-at: ${{ steps.prime.outputs.pre-change-cached-at }}
      report-artifact-id: ${{ steps.upload-report.outputs.artifact-id }}
      report-sha256: ${{ steps.report-digest.outputs.report-sha256 }}
    steps:
      - name: Check out exact protected SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.source.outputs.git-sha }}
          persist-credentials: false
      - name: Set up exact Node and pnpm
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Install frozen browser prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').packageManager")" = "pnpm@11.13.1"
          corepack enable
          corepack prepare pnpm@11.13.1 --activate
          corepack pnpm install --frozen-lockfile
          corepack pnpm --dir front exec playwright install --with-deps chromium
      - name: Prime real previous-policy browser cache
        id: prime
        env:
          READMATES_ROLLOUT_CACHE_PHASE: pre-change
          GITHUB_ACTIONS: "true"
          READMATES_HOST_ROLLOUT_LIVE_EVIDENCE: protected
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p front/output/host-rollout/reports
          python3 -B scripts/host-rollout-evidence-reporter.py run-command \
            --group cache-safety \
            --command seed-r2a-prechange-cache \
            --output front/output/host-rollout/reports/cache-seed.report.json
          printf 'pre-change-cached-at=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - name: Hash structured pre-change report
        id: report-digest
        shell: bash
        run: |
          set -euo pipefail
          digest="$(sha256sum front/output/host-rollout/reports/cache-seed.report.json | cut -d ' ' -f 1)"
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          printf 'report-sha256=sha256:%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Upload structured pre-change report without repackaging
        id: upload-report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: front/output/host-rollout/reports/cache-seed.report.json
          archive: false
          if-no-files-found: error
          retention-days: 14

  build-r2a-policy:
    name: Build and publish exact R2a backend policy
    needs:
      - source
      - prime-r2a-cache
    if: ${{ needs.source.outputs.stage == 'r2a' && needs.prime-r2a-cache.result == 'success' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy-server.yml
    with:
      image_tag: ${{ needs.source.outputs.release-tag }}
    secrets: inherit

  deploy-r2a-policy:
    name: Deploy and health-check exact R2a backend policy
    needs:
      - source
      - prime-r2a-cache
      - build-r2a-policy
    if: ${{ needs.source.outputs.stage == 'r2a' && needs.build-r2a-policy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: host-client-rollout-r2a
    permissions:
      contents: read
    outputs:
      backend-digest: ${{ needs.build-r2a-policy.outputs.backend-digest }}
      backend-deployed-at: ${{ steps.deploy.outputs.backend-deployed-at }}
    steps:
      - name: Check out exact protected SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.source.outputs.git-sha }}
          persist-credentials: false
      - name: Deploy digest-immutable policy and pass runtime health
        id: deploy
        env:
          VM_PUBLIC_IP: ${{ secrets.VM_PUBLIC_IP }}
          CADDY_SITE: ${{ secrets.CADDY_SITE }}
          OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          OCI_SSH_KNOWN_HOSTS: ${{ secrets.OCI_SSH_KNOWN_HOSTS }}
          BACKEND_DIGEST: ${{ needs.build-r2a-policy.outputs.backend-digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BACKEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test -n "$VM_PUBLIC_IP"
          test -n "$CADDY_SITE"
          test -n "$OCI_SSH_PRIVATE_KEY"
          test -n "$OCI_SSH_KNOWN_HOSTS"
          ssh_key="$RUNNER_TEMP/readmates-rollout-ssh-key"
          known_hosts="$RUNNER_TEMP/readmates-rollout-known-hosts"
          umask 077
          printf '%s\n' "$OCI_SSH_PRIVATE_KEY" > "$ssh_key"
          printf '%s\n' "$OCI_SSH_KNOWN_HOSTS" > "$known_hosts"
          export SSH_KEY="$ssh_key"
          export SSH_KNOWN_HOSTS="$known_hosts"
          export SSH_STRICT_HOST_KEY_CHECKING=yes
          export READMATES_SERVER_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/readmates-server@${BACKEND_DIGEST}"
          ./deploy/oci/05-deploy-compose-stack.sh
          printf 'backend-deployed-at=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
  deploy-r2a-pages:
    name: Deploy exact R2a Pages policy bytes
    needs:
      - source
      - pages-candidate
      - deploy-r2a-policy
    if: ${{ needs.source.outputs.stage == 'r2a' && needs.deploy-r2a-policy.result == 'success' }}
    permissions:
      actions: read
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy-front.yml
    with:
      candidate_artifact_id: ${{ needs.pages-candidate.outputs.artifact-id }}
      candidate_sha256: ${{ needs.pages-candidate.outputs.pages-digest }}
    secrets: inherit

  bind-r2a-runtime-pair:
    name: Bind deployed R2a backend and Pages runtime pair
    needs:
      - source
      - pages-candidate
      - deploy-r2a-policy
      - deploy-r2a-pages
    if: ${{ needs.source.outputs.stage == 'r2a' && needs.deploy-r2a-pages.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: host-client-rollout-r2a
      deployment: false
    outputs:
      backend-digest: ${{ steps.bind.outputs.backend-digest }}
      pages-digest: ${{ steps.bind.outputs.pages-digest }}
      policy-deployed-at: ${{ steps.bind.outputs.policy-deployed-at }}
      report-artifact-id: ${{ steps.upload-report.outputs.artifact-id }}
      report-sha256: ${{ steps.report-digest.outputs.report-sha256 }}
    steps:
      - name: Check out exact protected SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.source.outputs.git-sha }}
          persist-credentials: false
      - name: Set up exact Node and pnpm
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Install frozen browser prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').packageManager")" = "pnpm@11.13.1"
          corepack enable
          corepack prepare pnpm@11.13.1 --activate
          corepack pnpm install --frozen-lockfile
          corepack pnpm --dir front exec playwright install --with-deps chromium
      - name: Bind exact deployed digests after both runtime health proofs
        id: bind
        env:
          EXPECTED_PAGES_DIGEST: ${{ needs.pages-candidate.outputs.pages-digest }}
          DEPLOYED_PAGES_DIGEST: ${{ needs.deploy-r2a-pages.outputs.pages-digest }}
          BACKEND_DIGEST: ${{ needs.deploy-r2a-policy.outputs.backend-digest }}
          BACKEND_DEPLOYED_AT: ${{ needs.deploy-r2a-policy.outputs.backend-deployed-at }}
          PAGES_DEPLOYED_AT: ${{ needs.deploy-r2a-pages.outputs.deployed-at }}
          PAGES_RUNTIME_HEALTH_AT: ${{ needs.deploy-r2a-pages.outputs.runtime-health-at }}
          GITHUB_ACTIONS: "true"
          READMATES_HOST_ROLLOUT_LIVE_EVIDENCE: protected
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BACKEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$DEPLOYED_PAGES_DIGEST" = "$EXPECTED_PAGES_DIGEST"
          for timestamp in "$BACKEND_DEPLOYED_AT" "$PAGES_DEPLOYED_AT" "$PAGES_RUNTIME_HEALTH_AT"; do
            date -u -d "$timestamp" +%s >/dev/null
          done
          curl --fail --silent --show-error --location --max-time 20 --retry 5 --retry-all-errors \
            --output /dev/null https://readmates.pages.dev/app
          mkdir -p front/output/host-rollout/reports
          python3 -B scripts/host-rollout-evidence-reporter.py run-command \
            --group cache-safety \
            --command deploy-r2a-cache-policy \
            --output front/output/host-rollout/reports/cache-deploy.report.json
          paired_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          test "$(date -u -d "$paired_at" +%s)" -ge "$(date -u -d "$PAGES_RUNTIME_HEALTH_AT" +%s)"
          {
            printf 'backend-digest=%s\n' "$BACKEND_DIGEST"
            printf 'pages-digest=%s\n' "$DEPLOYED_PAGES_DIGEST"
            printf 'policy-deployed-at=%s\n' "$paired_at"
          } >> "$GITHUB_OUTPUT"
      - name: Hash structured deployed-pair report
        id: report-digest
        shell: bash
        run: |
          set -euo pipefail
          digest="$(sha256sum front/output/host-rollout/reports/cache-deploy.report.json | cut -d ' ' -f 1)"
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          printf 'report-sha256=sha256:%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Upload structured deployed-pair report without repackaging
        id: upload-report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: front/output/host-rollout/reports/cache-deploy.report.json
          archive: false
          if-no-files-found: error
          retention-days: 14

  wait-r2a-cache-lifetime:
    name: Wait out the real previous browser lifetime
    needs:
      - source
      - prime-r2a-cache
      - bind-r2a-runtime-pair
    if: ${{ needs.source.outputs.stage == 'r2a' && needs.bind-r2a-runtime-pair.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      wait-completed-at: ${{ steps.wait.outputs.wait-completed-at }}
    steps:
      - name: Wait until at least max timestamp plus 720 seconds
        id: wait
        env:
          PRE_CHANGE_CACHED_AT: ${{ needs.prime-r2a-cache.outputs.pre-change-cached-at }}
          POLICY_DEPLOYED_AT: ${{ needs.bind-r2a-runtime-pair.outputs.policy-deployed-at }}
        shell: bash
        run: |
          set -euo pipefail
          pre_epoch="$(date -u -d "$PRE_CHANGE_CACHED_AT" +%s)"
          policy_epoch="$(date -u -d "$POLICY_DEPLOYED_AT" +%s)"
          if (( pre_epoch > policy_epoch )); then base_epoch="$pre_epoch"; else base_epoch="$policy_epoch"; fi
          target_epoch=$((base_epoch + 720))
          now_epoch="$(date -u +%s)"
          if (( now_epoch < target_epoch )); then sleep "$((target_epoch - now_epoch))"; fi
          completed_epoch="$(date -u +%s)"
          (( completed_epoch >= target_epoch ))
          printf 'wait-completed-at=%s\n' "$(date -u -d "@$completed_epoch" +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

  browser-r2a-proof:
    name: Prove R2a cache behavior after the real wait
    needs:
      - source
      - wait-r2a-cache-lifetime
    if: ${{ needs.source.outputs.stage == 'r2a' && needs.wait-r2a-cache-lifetime.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: host-client-rollout-r2a
      deployment: false
    outputs:
      browser-proof-completed-at: ${{ steps.proof.outputs.browser-proof-completed-at }}
      report-artifact-id: ${{ steps.upload-report.outputs.artifact-id }}
      report-sha256: ${{ steps.report-digest.outputs.report-sha256 }}
    steps:
      - name: Check out exact protected SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.source.outputs.git-sha }}
          persist-credentials: false
      - name: Set up exact Node and pnpm
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Install frozen browser prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').packageManager")" = "pnpm@11.13.1"
          corepack enable
          corepack prepare pnpm@11.13.1 --activate
          corepack pnpm install --frozen-lockfile
          corepack pnpm --dir front exec playwright install --with-deps chromium
      - name: Run the bounded C1 cache proof
        id: proof
        env:
          GITHUB_ACTIONS: "true"
          READMATES_HOST_ROLLOUT_LIVE_EVIDENCE: protected
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p front/output/host-rollout/reports
          python3 -B scripts/host-rollout-evidence-reporter.py run-command \
            --group cache-safety \
            --command playwright-r2a-cache-safety \
            --output front/output/host-rollout/reports/cache-browser.report.json
          printf 'browser-proof-completed-at=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - name: Hash structured browser report
        id: report-digest
        shell: bash
        run: |
          set -euo pipefail
          digest="$(sha256sum front/output/host-rollout/reports/cache-browser.report.json | cut -d ' ' -f 1)"
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          printf 'report-sha256=sha256:%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Upload structured browser report without repackaging
        id: upload-report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: front/output/host-rollout/reports/cache-browser.report.json
          archive: false
          if-no-files-found: error
          retention-days: 14

  cache-report-r2a:
    name: Validate exact R2a structured report set
    needs:
      - source
      - prime-r2a-cache
      - bind-r2a-runtime-pair
      - browser-r2a-proof
    if: ${{ needs.source.outputs.stage == 'r2a' && needs.browser-r2a-proof.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      report-artifact-id: ${{ steps.upload-report.outputs.artifact-id }}
      report-sha256: ${{ steps.report-digest.outputs.report-sha256 }}
    steps:
      - name: Check out exact protected SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.source.outputs.git-sha }}
          persist-credentials: false
      - name: Download pre-change structured report
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ needs.prime-r2a-cache.outputs.report-artifact-id }}
          path: front/output/host-rollout/reports
          skip-decompress: true
          digest-mismatch: error
      - name: Download runtime structured report
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ needs.bind-r2a-runtime-pair.outputs.report-artifact-id }}
          path: front/output/host-rollout/reports
          skip-decompress: true
          digest-mismatch: error
      - name: Download browser structured report
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ needs.browser-r2a-proof.outputs.report-artifact-id }}
          path: front/output/host-rollout/reports
          skip-decompress: true
          digest-mismatch: error
      - name: Bind and combine exact report bytes
        env:
          SEED_SHA256: ${{ needs.prime-r2a-cache.outputs.report-sha256 }}
          DEPLOY_SHA256: ${{ needs.bind-r2a-runtime-pair.outputs.report-sha256 }}
          BROWSER_SHA256: ${{ needs.browser-r2a-proof.outputs.report-sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          test "sha256:$(sha256sum front/output/host-rollout/reports/cache-seed.report.json | cut -d ' ' -f 1)" = "$SEED_SHA256"
          test "sha256:$(sha256sum front/output/host-rollout/reports/cache-deploy.report.json | cut -d ' ' -f 1)" = "$DEPLOY_SHA256"
          test "sha256:$(sha256sum front/output/host-rollout/reports/cache-browser.report.json | cut -d ' ' -f 1)" = "$BROWSER_SHA256"
          python3 -B scripts/host-rollout-evidence-reporter.py combine \
            --group cache-safety \
            --input front/output/host-rollout/reports/cache-seed.report.json \
            --input front/output/host-rollout/reports/cache-deploy.report.json \
            --input front/output/host-rollout/reports/cache-browser.report.json \
            --output front/output/host-rollout/reports/cache-safety.report.json
      - name: Hash exact combined cache report
        id: report-digest
        shell: bash
        run: |
          set -euo pipefail
          digest="$(sha256sum front/output/host-rollout/reports/cache-safety.report.json | cut -d ' ' -f 1)"
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          printf 'report-sha256=sha256:%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Upload exact combined cache report without repackaging
        id: upload-report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: front/output/host-rollout/reports/cache-safety.report.json
          archive: false
          if-no-files-found: error
          retention-days: 14

  compatibility-r2b:
    name: Produce exact D3 compatibility results
    needs:
      - source
      - pages-candidate
    if: ${{ needs.source.outputs.stage == 'r2b' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      report-artifact-id: ${{ steps.upload-report.outputs.artifact-id }}
      report-sha256: ${{ steps.report-digest.outputs.report-sha256 }}
    steps:
      - name: Check out exact protected SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.source.outputs.git-sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up exact Node and pnpm
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Install frozen browser prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').packageManager")" = "pnpm@11.13.1"
          corepack enable
          corepack prepare pnpm@11.13.1 --activate
          corepack pnpm install --frozen-lockfile
          corepack pnpm --dir front exec playwright install --with-deps chromium
      - name: Run exact compatibility command set
        env:
          GITHUB_ACTIONS: "true"
          READMATES_HOST_ROLLOUT_LIVE_EVIDENCE: protected
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p front/output/host-rollout/reports
          for command in \
            bff-unit-contract-matrix \
            server-unit-contract-policy \
            server-integration-host-security \
            playwright-contract-rollout \
            playwright-non-session-regressions
          do
            python3 -B scripts/host-rollout-evidence-reporter.py run-command \
              --group compatibility \
              --command "$command" \
              --output "front/output/host-rollout/reports/${command}.report.json"
          done
          python3 -B scripts/host-rollout-evidence-reporter.py combine \
            --group compatibility \
            --input front/output/host-rollout/reports/bff-unit-contract-matrix.report.json \
            --input front/output/host-rollout/reports/server-unit-contract-policy.report.json \
            --input front/output/host-rollout/reports/server-integration-host-security.report.json \
            --input front/output/host-rollout/reports/playwright-contract-rollout.report.json \
            --input front/output/host-rollout/reports/playwright-non-session-regressions.report.json \
            --output front/output/host-rollout/reports/compatibility.report.json
      - name: Hash exact compatibility report
        id: report-digest
        shell: bash
        run: |
          set -euo pipefail
          digest="$(sha256sum front/output/host-rollout/reports/compatibility.report.json | cut -d ' ' -f 1)"
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          printf 'report-sha256=sha256:%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Upload exact compatibility report without repackaging
        id: upload-report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: front/output/host-rollout/reports/compatibility.report.json
          archive: false
          if-no-files-found: error
          retention-days: 14

  security-r2b:
    name: Produce exact B7 C1 D5 security results
    needs:
      - source
      - pages-candidate
    if: ${{ needs.source.outputs.stage == 'r2b' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      report-artifact-id: ${{ steps.upload-report.outputs.artifact-id }}
      report-sha256: ${{ steps.report-digest.outputs.report-sha256 }}
    steps:
      - name: Check out exact protected SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.source.outputs.git-sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up exact Node and pnpm
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Install frozen browser prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').packageManager")" = "pnpm@11.13.1"
          corepack enable
          corepack prepare pnpm@11.13.1 --activate
          corepack pnpm install --frozen-lockfile
          corepack pnpm --dir front exec playwright install --with-deps chromium
      - name: Run exact security and cache command set
        env:
          GITHUB_ACTIONS: "true"
          READMATES_HOST_ROLLOUT_LIVE_EVIDENCE: protected
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p front/output/host-rollout/reports
          python3 -B scripts/host-rollout-evidence-reporter.py run-command \
            --group security \
            --command playwright-authority-cache-regressions \
            --output front/output/host-rollout/reports/security.report.json
      - name: Hash exact security report
        id: report-digest
        shell: bash
        run: |
          set -euo pipefail
          digest="$(sha256sum front/output/host-rollout/reports/security.report.json | cut -d ' ' -f 1)"
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          printf 'report-sha256=sha256:%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Upload exact security report without repackaging
        id: upload-report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: front/output/host-rollout/reports/security.report.json
          archive: false
          if-no-files-found: error
          retention-days: 14

  resolve-r2a:
    name: Resolve and verify immutable R2a evidence
    needs: source
    if: ${{ needs.source.outputs.stage == 'r2b' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      run-id: ${{ steps.run.outputs.run-id }}
      backend-digest: ${{ steps.identity.outputs.backend-digest }}
      pages-digest: ${{ steps.identity.outputs.pages-digest }}
      git-sha: ${{ steps.identity.outputs.git-sha }}
      cache-source-set-digest: ${{ steps.identity.outputs.cache-source-set-digest }}
    steps:
      - name: Check out exact R2b SHA and full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.source.outputs.git-sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the unique prior R2a workflow run from Git history
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current_tag="${{ needs.source.outputs.release-tag }}"
          r2a_tag="$(git describe --tags --abbrev=0 "${current_tag}^" --match 'v[0-9]*.[0-9]*.[0-9]*')"
          r2a_sha="$(git rev-list -n 1 "$r2a_tag")"
          [[ "$r2a_sha" =~ ^[0-9a-f]{40}$ ]]
          response="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/host-client-rollout-evidence.yml/runs" -f event=workflow_dispatch -f branch=host-rollout-r2a -f head_sha="$r2a_sha" -f status=success -f per_page=2)"
          run_id="$(jq -er 'if (.workflow_runs | length) == 1 then .workflow_runs[0].id else error("ambiguous R2a run") end' <<< "$response")"
          [[ "$run_id" =~ ^[1-9][0-9]*$ ]]
          printf 'run-id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"
      - name: Download the exact prior attested R2a evidence
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: host-rollout-r2a-attested
          path: front/output/host-rollout/r2a
          run-id: ${{ steps.run.outputs.run-id }}
          github-token: ${{ github.token }}
          digest-mismatch: error
      - name: Verify prior R2a attestation before importing identity
        env:
          GITHUB_ACTIONS: "true"
          READMATES_HOST_ROLLOUT_LIVE_EVIDENCE: protected
          READMATES_HOST_ROLLOUT_REF_PROTECTED: ${{ github.ref_protected }}
          READMATES_HOST_ROLLOUT_SIGNER_WORKFLOW_REF: ${{ format('{0}/.github/workflows/host-client-rollout-evidence.yml@{1}', github.repository, github.ref) }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/verify-host-client-rollout-evidence.py \
            --manifest front/output/host-rollout/r2a/cache-safety.manifest.json \
            --attestation front/output/host-rollout/r2a/cache-safety.intoto.jsonl \
            --kind cache-safety
      - name: Export only verified R2a identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - front/output/host-rollout/r2a/cache-safety.manifest.json "$GITHUB_OUTPUT" <<'PY'
          import json
          import pathlib
          import re
          import sys
          manifest = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          values = {
              "backend-digest": manifest["backendDigest"],
              "pages-digest": manifest["pagesDigest"],
              "git-sha": manifest["gitSha"],
              "cache-source-set-digest": manifest["cacheSafetySourceSetDigest"],
          }
          patterns = {
              "backend-digest": r"sha256:[0-9a-f]{64}",
              "pages-digest": r"sha256:[0-9a-f]{64}",
              "git-sha": r"[0-9a-f]{40}",
              "cache-source-set-digest": r"sha256:[0-9a-f]{64}",
          }
          if any(re.fullmatch(patterns[key], value) is None for key, value in values.items()):
              raise SystemExit("Verified R2a identity is invalid.")
          with pathlib.Path(sys.argv[2]).open("a", encoding="utf-8") as output:
              for key, value in values.items():
                  output.write(f"{key}={value}\n")
          PY

  attest-evidence:
    name: Construct and attest protected evidence
    needs:
      - source
      - pages-candidate
      - prime-r2a-cache
      - deploy-r2a-policy
      - bind-r2a-runtime-pair
      - wait-r2a-cache-lifetime
      - browser-r2a-proof
      - cache-report-r2a
      - compatibility-r2b
      - security-r2b
      - resolve-r2a
    if: >-
      ${{ always() && needs.source.result == 'success' && needs.pages-candidate.result == 'success' &&
          ((needs.source.outputs.stage == 'r2a' && needs.prime-r2a-cache.result == 'success' &&
            needs.deploy-r2a-policy.result == 'success' && needs.wait-r2a-cache-lifetime.result == 'success' &&
            needs.bind-r2a-runtime-pair.result == 'success' && needs.browser-r2a-proof.result == 'success' &&
            needs.cache-report-r2a.result == 'success') ||
           (needs.source.outputs.stage == 'r2b' && needs.compatibility-r2b.result == 'success' &&
            needs.security-r2b.result == 'success' && needs.resolve-r2a.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: host-client-rollout-evidence
      deployment: false
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check out exact protected SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.source.outputs.git-sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download exact candidate bytes
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ needs.pages-candidate.outputs.artifact-id }}
          path: front/output/host-rollout/candidate
          skip-decompress: true
          digest-mismatch: error
      - name: Verify exact candidate digest
        env:
          EXPECTED_PAGES_DIGEST: ${{ needs.pages-candidate.outputs.pages-digest }}
        shell: bash
        run: |
          set -euo pipefail
          test "sha256:$(sha256sum front/output/host-rollout/candidate/readmates-pages-candidate.tar | cut -d ' ' -f 1)" = "$EXPECTED_PAGES_DIGEST"
      - name: Download exact R2a validated structured report
        if: ${{ needs.source.outputs.stage == 'r2a' }}
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ needs.cache-report-r2a.outputs.report-artifact-id }}
          path: front/output/host-rollout/reports
          skip-decompress: true
          digest-mismatch: error
      - name: Download exact R2b compatibility report
        if: ${{ needs.source.outputs.stage == 'r2b' }}
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ needs.compatibility-r2b.outputs.report-artifact-id }}
          path: front/output/host-rollout/reports
          skip-decompress: true
          digest-mismatch: error
      - name: Download exact R2b security report
        if: ${{ needs.source.outputs.stage == 'r2b' }}
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ needs.security-r2b.outputs.report-artifact-id }}
          path: front/output/host-rollout/reports
          skip-decompress: true
          digest-mismatch: error
      - name: Verify exact structured report bytes and contract
        env:
          STAGE: ${{ needs.source.outputs.stage }}
          CACHE_REPORT_SHA256: ${{ needs.cache-report-r2a.outputs.report-sha256 }}
          COMPATIBILITY_REPORT_SHA256: ${{ needs.compatibility-r2b.outputs.report-sha256 }}
          SECURITY_REPORT_SHA256: ${{ needs.security-r2b.outputs.report-sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$STAGE" == "r2a" ]]; then
            test "sha256:$(sha256sum front/output/host-rollout/reports/cache-safety.report.json | cut -d ' ' -f 1)" = "$CACHE_REPORT_SHA256"
            python3 -B scripts/host-rollout-evidence-reporter.py validate-report --group cache-safety --report front/output/host-rollout/reports/cache-safety.report.json
          else
            test "sha256:$(sha256sum front/output/host-rollout/reports/compatibility.report.json | cut -d ' ' -f 1)" = "$COMPATIBILITY_REPORT_SHA256"
            test "sha256:$(sha256sum front/output/host-rollout/reports/security.report.json | cut -d ' ' -f 1)" = "$SECURITY_REPORT_SHA256"
            python3 -B scripts/host-rollout-evidence-reporter.py validate-report --group compatibility --report front/output/host-rollout/reports/compatibility.report.json
            python3 -B scripts/host-rollout-evidence-reporter.py validate-report --group security --report front/output/host-rollout/reports/security.report.json
          fi
      - name: Construct bounded manifests from protected job outputs
        id: manifest
        env:
          STAGE: ${{ needs.source.outputs.stage }}
          GIT_SHA: ${{ needs.source.outputs.git-sha }}
          CANDIDATE_ID: ${{ needs.source.outputs.candidate-id }}
          RELEASE_TAG: ${{ needs.source.outputs.release-tag }}
          PRODUCER_STARTED_AT: ${{ needs.source.outputs.started-at }}
          PAGES_DIGEST: ${{ needs.pages-candidate.outputs.pages-digest }}
          R2A_BACKEND_DIGEST: ${{ needs.bind-r2a-runtime-pair.outputs.backend-digest }}
          R2A_PAGES_DIGEST: ${{ needs.bind-r2a-runtime-pair.outputs.pages-digest }}
          IMPORTED_BACKEND_DIGEST: ${{ needs.resolve-r2a.outputs.backend-digest }}
          CACHE_SOURCE_SET_DIGEST: ${{ needs.source.outputs.cache-source-set-digest }}
          IMPORTED_CACHE_SOURCE_SET_DIGEST: ${{ needs.resolve-r2a.outputs.cache-source-set-digest }}
          PRE_CHANGE_CACHED_AT: ${{ needs.prime-r2a-cache.outputs.pre-change-cached-at }}
          POLICY_DEPLOYED_AT: ${{ needs.bind-r2a-runtime-pair.outputs.policy-deployed-at }}
          WAIT_COMPLETED_AT: ${{ needs.wait-r2a-cache-lifetime.outputs.wait-completed-at }}
          BROWSER_PROOF_COMPLETED_AT: ${{ needs.browser-r2a-proof.outputs.browser-proof-completed-at }}
          A7_SHA: ${{ needs.source.outputs.a7-sha }}
          C1_SHA: ${{ needs.source.outputs.c1-sha }}
          B7_SHA: ${{ needs.source.outputs.b7-sha }}
          D3_SHA: ${{ needs.source.outputs.d3-sha }}
          D5_SHA: ${{ needs.source.outputs.d5-sha }}
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE_PRODUCED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          export EVIDENCE_PRODUCED_AT
          mkdir -p front/output/host-rollout/attested
          python3 -B - <<'PY'
          import json
          import os
          import pathlib

          stage = os.environ["STAGE"]
          kinds = ["cache-safety"] if stage == "r2a" else ["compatibility", "security"]
          backend_digest = os.environ["R2A_BACKEND_DIGEST"] if stage == "r2a" else os.environ["IMPORTED_BACKEND_DIGEST"]
          pages_digest = os.environ["R2A_PAGES_DIGEST"] if stage == "r2a" else os.environ["PAGES_DIGEST"]
          source_digest = os.environ["CACHE_SOURCE_SET_DIGEST"]
          if stage == "r2b" and source_digest != os.environ["IMPORTED_CACHE_SOURCE_SET_DIGEST"]:
              raise SystemExit("C1 source-set digest changed between protected stages.")
          provenance = {
              "cache-safety": [("A7", os.environ["A7_SHA"]), ("C1", os.environ["C1_SHA"])],
              "compatibility": [("D3", os.environ["D3_SHA"])],
              "security": [("B7", os.environ["B7_SHA"]), ("C1", os.environ["C1_SHA"]), ("D5", os.environ["D5_SHA"])],
          }
          for kind in kinds:
              report_path = pathlib.Path(f"front/output/host-rollout/reports/{kind}.report.json")
              report = json.loads(report_path.read_text(encoding="utf-8"))
              stage_value = {
                  "name": "R2a" if stage == "r2a" else "R2b",
                  "releaseTag": os.environ["RELEASE_TAG"],
                  "browserContract": "v2" if stage == "r2a" else "v3",
                  "evidenceProducedAt": os.environ["EVIDENCE_PRODUCED_AT"],
              }
              if stage == "r2a":
                  stage_value.update({
                      "preChangeCachedAt": os.environ["PRE_CHANGE_CACHED_AT"],
                      "policyDeployedAt": os.environ["POLICY_DEPLOYED_AT"],
                      "waitCompletedAt": os.environ["WAIT_COMPLETED_AT"],
                      "browserProofCompletedAt": os.environ["BROWSER_PROOF_COMPLETED_AT"],
                  })
              manifest = {
                  "schemaVersion": "host-client-rollout-evidence/v1",
                  "evidenceKind": kind,
                  "gitSha": os.environ["GIT_SHA"],
                  "candidateId": os.environ["CANDIDATE_ID"],
                  "backendDigest": backend_digest,
                  "pagesDigest": pages_digest,
                  "cacheSafetySourceSetDigest": source_digest,
                  "producer": {
                      "repository": os.environ["GITHUB_REPOSITORY"],
                      "workflowRef": f"{os.environ['GITHUB_REPOSITORY']}/.github/workflows/host-client-rollout-evidence.yml@{os.environ['GITHUB_REF']}",
                      "sourceRef": os.environ["GITHUB_REF"],
                      "runId": os.environ["GITHUB_RUN_ID"],
                      "runAttempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
                      "job": kind,
                      "startedAt": os.environ["PRODUCER_STARTED_AT"],
                  },
                  "commands": [{"id": item["id"], "result": item["result"]} for item in report["commands"]],
                  "cases": [{"id": item["id"], "result": item["result"]} for item in report["cases"]],
                  "provenance": [{"id": item, "gitSha": sha} for item, sha in provenance[kind]],
                  "stage": stage_value,
              }
              path = pathlib.Path(f"front/output/host-rollout/attested/{kind}.manifest.json")
              path.write_text(json.dumps(manifest, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          PY
          for manifest in front/output/host-rollout/attested/*.manifest.json; do
            kind="$(basename "$manifest" .manifest.json)"
            python3 -B scripts/verify-host-client-rollout-evidence.py --manifest "$manifest" --kind "$kind" --schema-only
          done
      - name: Attest exact deterministic Pages candidate bytes
        id: attest-pages
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: front/output/host-rollout/candidate/readmates-pages-candidate.tar
      - name: Attest R2a cache manifest
        id: attest-cache
        if: ${{ needs.source.outputs.stage == 'r2a' }}
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: front/output/host-rollout/attested/cache-safety.manifest.json
      - name: Attest R2b compatibility manifest
        id: attest-compatibility
        if: ${{ needs.source.outputs.stage == 'r2b' }}
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: front/output/host-rollout/attested/compatibility.manifest.json
      - name: Attest R2b security manifest
        id: attest-security
        if: ${{ needs.source.outputs.stage == 'r2b' }}
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: front/output/host-rollout/attested/security.manifest.json
      - name: Stage explicit attestation bundles
        env:
          STAGE: ${{ needs.source.outputs.stage }}
          PAGES_BUNDLE: ${{ steps.attest-pages.outputs.bundle-path }}
          CACHE_BUNDLE: ${{ steps.attest-cache.outputs.bundle-path }}
          COMPATIBILITY_BUNDLE: ${{ steps.attest-compatibility.outputs.bundle-path }}
          SECURITY_BUNDLE: ${{ steps.attest-security.outputs.bundle-path }}
        shell: bash
        run: |
          set -euo pipefail
          install -m 0600 "$PAGES_BUNDLE" front/output/host-rollout/attested/pages-candidate.intoto.jsonl
          if [[ "$STAGE" == "r2a" ]]; then
            install -m 0600 "$CACHE_BUNDLE" front/output/host-rollout/attested/cache-safety.intoto.jsonl
          else
            install -m 0600 "$COMPATIBILITY_BUNDLE" front/output/host-rollout/attested/compatibility.intoto.jsonl
            install -m 0600 "$SECURITY_BUNDLE" front/output/host-rollout/attested/security.intoto.jsonl
          fi
      - name: Upload explicit manifests and bundles
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: host-rollout-${{ needs.source.outputs.stage }}-attested
          path: front/output/host-rollout/attested/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false

  final-evidence-gate:
    name: Verify the final live R2b evidence contract
    needs:
      - source
      - pages-candidate
      - resolve-r2a
      - attest-evidence
    if: ${{ needs.source.outputs.stage == 'r2b' && needs.attest-evidence.result == 'success' && needs.resolve-r2a.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: host-client-rollout-evidence
      deployment: false
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out exact protected R2b SHA and full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.source.outputs.git-sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download current attested R2b evidence
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ needs.attest-evidence.outputs.artifact-id }}
          path: front/output/host-rollout/r2b
          digest-mismatch: error
      - name: Download prior attested R2a evidence
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: host-rollout-r2a-attested
          path: front/output/host-rollout/r2a
          run-id: ${{ needs.resolve-r2a.outputs.run-id }}
          github-token: ${{ github.token }}
          digest-mismatch: error
      - name: Download exact R2b Pages candidate bytes
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ needs.pages-candidate.outputs.artifact-id }}
          path: front/output/host-rollout/pages
          skip-decompress: true
          digest-mismatch: error
      - name: Invoke live verifier with only protected job and verified artifact values
        env:
          GITHUB_ACTIONS: "true"
          READMATES_HOST_ROLLOUT_LIVE_EVIDENCE: protected
          READMATES_HOST_ROLLOUT_REF_PROTECTED: ${{ github.ref_protected }}
          READMATES_HOST_ROLLOUT_SIGNER_WORKFLOW_REF: ${{ format('{0}/.github/workflows/host-client-rollout-evidence.yml@{1}', github.repository, github.ref) }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/check-host-client-rollout-contract.py \
            --cache-manifest front/output/host-rollout/r2a/cache-safety.manifest.json \
            --cache-attestation front/output/host-rollout/r2a/cache-safety.intoto.jsonl \
            --compat-manifest front/output/host-rollout/r2b/compatibility.manifest.json \
            --compat-attestation front/output/host-rollout/r2b/compatibility.intoto.jsonl \
            --security-manifest front/output/host-rollout/r2b/security.manifest.json \
            --security-attestation front/output/host-rollout/r2b/security.intoto.jsonl \
            --pages-candidate front/output/host-rollout/pages/readmates-pages-candidate.tar \
            --pages-attestation front/output/host-rollout/r2b/pages-candidate.intoto.jsonl \
            --r2a-git-sha '${{ needs.resolve-r2a.outputs.git-sha }}' \
            --r2a-backend-digest '${{ needs.resolve-r2a.outputs.backend-digest }}' \
            --r2a-pages-digest '${{ needs.resolve-r2a.outputs.pages-digest }}' \
            --r2b-git-sha '${{ needs.source.outputs.git-sha }}' \
            --r2b-backend-digest '${{ needs.resolve-r2a.outputs.backend-digest }}' \
            --r2b-pages-digest '${{ needs.pages-candidate.outputs.pages-digest }}' \
            --attestation-repository "$GITHUB_REPOSITORY"

  deploy-r2b-pages:
    name: Deploy the exact gated R2b Pages candidate
    needs:
      - source
      - pages-candidate
      - final-evidence-gate
    if: ${{ needs.final-evidence-gate.result == 'success' }}
    permissions:
      actions: read
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy-front.yml
    with:
      candidate_artifact_id: ${{ needs.pages-candidate.outputs.artifact-id }}
      candidate_sha256: ${{ needs.pages-candidate.outputs.pages-digest }}
    secrets: inherit
