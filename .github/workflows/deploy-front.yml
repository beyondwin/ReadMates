name: Deploy Front

on:
  workflow_call:
    inputs:
      candidate_artifact_id:
        required: true
        type: string
      candidate_sha256:
        required: true
        type: string
      candidate_git_sha:
        required: true
        type: string
      release_tag:
        required: true
        type: string

permissions:
  actions: read
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy gated Cloudflare Pages bytes
    if: ${{ github.ref_protected && github.event_name == 'push' && github.ref == 'refs/heads/host-rollout-r2b' && github.event.repository.fork == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://readmates.pages.dev
    steps:
      - name: Check out exact protected SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.candidate_git_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind reusable caller and immutable tag
        env:
          CANDIDATE_GIT_SHA: ${{ inputs.candidate_git_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/host-client-rollout-evidence.yml@$GITHUB_REF"
          [[ "$CANDIDATE_GIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_GIT_SHA"
          test "$(git cat-file -t "$RELEASE_TAG")" = "tag"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$CANDIDATE_GIT_SHA"
      - name: Download exact gated candidate without decompression
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ inputs.candidate_artifact_id }}
          path: front/output/host-rollout/deploy
          skip-decompress: true
          digest-mismatch: error
      - name: Verify and extract exact candidate bytes
        env:
          EXPECTED_SHA256: ${{ inputs.candidate_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA256" =~ ^sha256:[0-9a-f]{64}$ ]]
          candidate="front/output/host-rollout/deploy/readmates-pages-candidate.tar"
          test -f "$candidate"
          test ! -L "$candidate"
          test "sha256:$(sha256sum "$candidate" | cut -d ' ' -f 1)" = "$EXPECTED_SHA256"
          mkdir -p front/output/host-rollout/extracted
          tar -xf "$candidate" -C front/output/host-rollout/extracted
          test -d front/output/host-rollout/extracted/dist
          test -d front/output/host-rollout/extracted/functions
      - name: Deploy only the verified extracted dist
        working-directory: front/output/host-rollout/extracted
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@4.84.1 pages deploy dist \
            --project-name readmates \
            --branch main \
            --commit-dirty=false
