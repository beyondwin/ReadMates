name: Deploy Front

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to deploy after backend promotion, for example v2.0.0"
        required: true
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_tag }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Cloudflare Pages
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://readmates.pages.dev
    defaults:
      run:
        working-directory: front
    steps:
      - name: Validate release tag
        working-directory: .
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Verify checked out release tag
        working-directory: .
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Set up pnpm from packageManager
        working-directory: .
        run: |
          if command -v corepack >/dev/null 2>&1; then
            corepack_cmd=(corepack)
          else
            corepack_cmd=(npx --yes corepack@0.35.0)
          fi
          "${corepack_cmd[@]}" enable
          "${corepack_cmd[@]}" prepare "$(node -p "require('./package.json').packageManager")" --activate
          "${corepack_cmd[@]}" pnpm --version

      - name: Restore pnpm cache
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check zod fixtures are up to date
        run: |
          pnpm zod:export-fixtures
          git diff --exit-code tests/unit/__fixtures__/zod-schemas/

      - name: Deploy to Cloudflare Pages
        run: |
          npx --yes wrangler@4.84.1 pages deploy dist \
            --project-name readmates \
            --branch main \
            --commit-dirty=false
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Upload frontend failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deploy-front-failure-diagnostics
          path: |
            front/test-results
            front/dist
          if-no-files-found: ignore
