name: Deploy Front

on:
  workflow_call:
    inputs:
      candidate_artifact_id:
        required: true
        type: string
      candidate_sha256:
        required: true
        type: string
    outputs:
      pages-digest:
        description: SHA-256 of exact deployed deterministic candidate bytes
        value: ${{ jobs.deploy.outputs.pages-digest }}
      deployed-at:
        description: Time the exact Pages deploy command completed
        value: ${{ jobs.deploy.outputs.deployed-at }}
      runtime-health-at:
        description: Time the deployed Pages runtime health proof completed
        value: ${{ jobs.deploy.outputs.runtime-health-at }}

permissions:
  actions: read
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy gated Cloudflare Pages bytes
    if: >-
      ${{ github.ref_protected && github.event_name == 'workflow_dispatch' &&
          (github.ref == 'refs/heads/host-rollout-r2a' || github.ref == 'refs/heads/host-rollout-r2b') &&
          github.event.repository.fork == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ github.ref == 'refs/heads/host-rollout-r2a' && 'host-client-rollout-r2a' || 'production' }}
      url: https://readmates.pages.dev
    outputs:
      pages-digest: ${{ steps.verify.outputs.pages-digest }}
      deployed-at: ${{ steps.deploy.outputs.deployed-at }}
      runtime-health-at: ${{ steps.health.outputs.runtime-health-at }}
    steps:
      - name: Check out exact protected caller SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Derive immutable stage and tag from protected caller context
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/host-client-rollout-evidence.yml@$GITHUB_REF"
          case "$GITHUB_REF" in
            refs/heads/host-rollout-r2a) stage=r2a ;;
            refs/heads/host-rollout-r2b) stage=r2b ;;
            *) echo "Unsupported protected Pages deployment ref." >&2; exit 1 ;;
          esac
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "$GITHUB_SHA"
          mapfile -t tags < <(git tag --points-at "$GITHUB_SHA" --list 'v[0-9]*.[0-9]*.[0-9]*')
          test "${#tags[@]}" -eq 1
          release_tag="${tags[0]}"
          test "$(git cat-file -t "$release_tag")" = tag
          test "$(git rev-list -n 1 "$release_tag")" = "$GITHUB_SHA"
          printf 'Derived protected Pages stage %s from caller ref.\n' "$stage"
      - name: Download exact gated candidate without decompression
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ inputs.candidate_artifact_id }}
          path: front/output/host-rollout/deploy
          skip-decompress: true
          digest-mismatch: error
      - name: Verify candidate digest and reject unsafe archive members
        id: verify
        env:
          EXPECTED_SHA256: ${{ inputs.candidate_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA256" =~ ^sha256:[0-9a-f]{64}$ ]]
          candidate="front/output/host-rollout/deploy/readmates-pages-candidate.tar"
          test -f "$candidate"
          test ! -L "$candidate"
          test "sha256:$(sha256sum "$candidate" | cut -d ' ' -f 1)" = "$EXPECTED_SHA256"
          python3 -B scripts/validate-host-rollout-candidate.py --candidate "$candidate"
          mkdir -p front/output/host-rollout/extracted
          tar --extract --file "$candidate" \
            --directory front/output/host-rollout/extracted \
            --no-same-owner --no-same-permissions --numeric-owner
          test -d front/output/host-rollout/extracted/dist
          test -d front/output/host-rollout/extracted/functions
          test -z "$(find front/output/host-rollout/extracted -type l -print -quit)"
          printf 'pages-digest=%s\n' "$EXPECTED_SHA256" >> "$GITHUB_OUTPUT"
      - name: Deploy only the verified extracted bytes
        id: deploy
        working-directory: front/output/host-rollout/extracted
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.84.1 pages deploy dist \
            --project-name readmates \
            --branch main \
            --commit-dirty=false
          printf 'deployed-at=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - name: Require deployed Pages runtime health
        id: health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 --retry 5 --retry-all-errors \
            --output /dev/null https://readmates.pages.dev/app
          printf 'runtime-health-at=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
